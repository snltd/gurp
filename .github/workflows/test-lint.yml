name: Lint Tests
permissions:
  contents: read
on: 
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-lint
  cancel-in-progress: true

jobs:
  typo-checks:
    name: Typo Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Check for Typos
        uses: crate-ci/typos@a8168dc2984a9e2352f183ffe788f0f23a300389 # 1.49.1
