[package]
name = "gurp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
blake3 = "1.8.2"
camino = { version = "1.1.9", features = ["serde1"] }
clap = { version = "4.3", features = ["derive"] }
indoc = "2.0.6"
janetrs = "0.8.0"
nix = { version = "0.30.1", features = ["user", "fs"] }
paste = "1.0.15"
rand = "0.9.1"
regex = "1.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xml-rs = "0.8.26"
xmlwriter = "0.1.0"

[dev-dependencies]
assert_cmd = "2.0.17"
assert_fs = "1.1.2"
predicates = "3.1.3"
pretty_assertions = "1.4.1"
