[package]
name = "gurp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
blake3 = "1.8.2"
camino = { version = "1.1.9", features = ["serde1"] }
clap = { version = "4.3", features = ["derive"] }
colored = "3.0.0"
janetrs = "0.8.0"
nix = { version = "0.30.1", features = ["user", "fs"] }
paste = "1.0.15"
xmlwriter = "0.1.0"

[dev-dependencies]
assert_cmd = "2.0.17"
assert_fs = "1.1.2"
indoc = "2.0.6"
predicates = "3.1.3"
pretty_assertions = "1.4.1"
xml-rs = "0.8.26"
