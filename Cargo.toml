[package]
name = "gurp"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.3", features = ["derive"] }
anyhow = "1.0.98"
camino = { version = "1.1.9", features = ["serde1"] }
janetrs = "0.8.0"
serde_json = "1.0.140"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0.17"
assert_fs = "1.1.2"
predicates = "3.1.3"
