[package]
name = "doers"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
byte-unit = "5.1.6"
bytesize = "2.3.1"
camino = { version = "1.1.9", features = ["serde1"] }
camino-tempfile = "1.4.1"
colored = "3.1.1"
common = { path = "../common" }
fs_extra = "1.3.0"
indoc = "2.0.6"
macros = { path = "../macros" }
nix = { version = "0.31.0", features = ["user", "fs"] }
portable-pty = "0.9.0"
rand = "0.10.0"
regex = "1.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2.1.3"
toml = "1.0.0"
tracing = "0.1.41"
ureq = { version = "3", features = ["json"] }
util = { path = "../util" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
camino-tempfile-ext = "0.3.3"
httpmock = "0.8"
pretty_assertions = "1.4.1"
tester = { path = "../tester" }

[build-dependencies]
build_helper = { path = "../build_helper" }
