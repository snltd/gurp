[package]
name = "doers"
version = "1.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
blake3 = "1.8.2"
byte-unit = "5.1.6"
camino = { version = "1.1.9", features = ["serde1"] }
camino-tempfile = "1.4.1"
colored = "3.0.0"
common = { path = "../common" }
fs_extra = "1.3.0"
indoc = "2.0.6"
janet_int = { path = "../janet_int" }
janetrs = "0.8.0"
macros = { path = "../macros" }
nix = { version = "0.30.1", features = ["user", "fs"] }
portable-pty = "0.9.0"
rand = "0.9.2"
regex = "1.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2.1.3"
sha256 = "1.6.0"
toml = "0.9.5"
tracing = "0.1.41"
ureq = { version = "3", features = ["json"] }
util = { path = "../util" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
camino-tempfile-ext = "0.3.3"
httpmock = "0.7.0"
pretty_assertions = "1.4.1"
tester = { path = "../tester" }
