[package]
name = "doers"
version = "2.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
byte-unit = "5.1.6"
bytesize = "2.3.1"
camino = { version = "1.1.9", features = ["serde1"] }
camino-tempfile = "1.4.1"
common = { path = "../common" }
fs_extra = "1.3.0"
gurptel = { path = "../gurptel" }
indoc = "2.0.6"
ipnet = { version = "2.12.0", features = ["serde"] }
macros = { path = "../macros" }
nix = { version = "0.31.0", features = ["user", "fs"] }
os_types = { path = "../os_types" }
owo-colors = "4.3.0"
portable-pty = "0.9.0"
rand = "0.10.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2"
toml = "1.1.2"
tracing = "0.1.41"
ureq = { version = "3", features = ["json"] }
url = { version = "2.5.8", features = ["serde"] }
util = { path = "../util" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
camino-tempfile-ext = "0.3.3"
httpmock = "0.8"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
tester = { path = "../tester" }

[build-dependencies]
build_helper = { path = "../build_helper" }
