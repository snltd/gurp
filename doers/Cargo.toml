[package]
name = "doers"
version = "0.1.0"
edition = "2024"

[dependencies]
camino = { version = "1.1.9", features = ["serde1"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1.0.140"
fs_extra = "1.3.0"
byte-unit = "5.1.6"
nix = { version = "0.30.1", features = ["user", "fs"] }
serde = { version = "1", features = ["derive"] }
macros = { path = "../macros" }
common = { path = "../common" }
util = { path = "../util" }
anyhow = "1.0.99"
tracing = "0.1.41"
blake3 = "1.8.2"
regex = "1.11.1"
janet_int = { path = "../janet_int" }
janetrs = "0.8.0"
indoc = "2.0.6"
rand = "0.9.2"

[dev-dependencies]
assert_fs = "1.1.3"
pretty_assertions = "1.4.1"
tester = { path = "../tester" }
