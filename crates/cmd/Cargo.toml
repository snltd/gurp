[package]
name = "cmd"
version = "2.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
axum = { version = "0.8.8", features = ["macros"] }
axum-macros = "0.5.0"
camino = "1.1.9"
common = { path = "../common"} 
doers = { path = "../doers" }
embed = { path = "../embed" } 
gurptel = { path = "../gurptel" }
indoc = "2.0.6"
jiff = { version = "1", features = ["serde"] }
macros = { path = "../macros" }
mime_guess = "2.0.5"
opentelemetry = "0.33.0"
serde = "1.0.228"
serde_json = "1.0.149"
terminal_size = "0.4.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tokio-util = { version = "0.7.16", features = ["io"] }
tracing = "0.1.41"
ureq = "3.1.0"
util = { path = "../util" }

[dev-dependencies]
camino-tempfile-ext = "0.3.3"
pretty_assertions = "1.4.1"
tester = { path = "../tester" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2.6"
