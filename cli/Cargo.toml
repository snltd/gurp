[package]
name = "gurp"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
camino = "1.1.9" 
clap = { version = "4.3", features = ["derive"] }
commands = { path = "../commands" }
common = { path = "../common" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
pretty_assertions = "1.4.1"
tester = { path = "../tester" }
